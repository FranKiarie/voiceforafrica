# Mikaka Voice API. Runs in the voice product's own Fly org (not Mikaka's).
app = "mikaka-voice-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_SITE_URL = "https://voice.mikaka.io"
  ALLOWED_ORIGINS = "https://voice.mikaka.io,https://voiceforafrica.vercel.app"
  SUPABASE_URL = "https://fiiyrrdrgsxkpxqqzbxw.supabase.co"

[http_service]
  internal_port = 8080
  force_https = true
  # Paystack webhooks and background clip generation need a machine that stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
